program_id: DIVINIVID-VUE-100-V1
status: PLAN_LOCKED
date: '2026-09-20'
authority_inputs:
  visual_canon: VISUAL_CANON_V1.md
  canon_registry: VISUAL_CANON_REGISTRY_V1.csv
  lineage_registry: VISUAL_LINEAGE_REGISTRY_V1.csv
  anti_canon: ANTI_CANON.md
  metaplan: DIVINIVID_VISUAL_UNIVERSE_META_PLAN_V2.md
  skill_mode: brand-visual-direction:VISUAL_UNIVERSE_EXPANSION
global_contract:
  format: one independent 16:9 moodboard; never a five-board composite
  visual_authority: VISUAL_CANON_V1 + APPROVED_SUPPORT; NEGATIVE_CANON is binding anti-reference
  base_palette: &id001
  - near-absolute black
  - ivory
  - living crimson
  conditional_palette: &id002
    aged_gold: instrumentation, hierarchy, measurement, liturgical order
    ultramar: selective; may become materially stronger only in medieval/bestiary/celestial systems
  forbidden_drift: &id003
  - generic dark academia
  - parchment-everywhere treatment
  - generic occult/tarot branding
  - videogame dark-fantasy concept art
  - cyan/neon
  - grid-as-spectacle modernism
  - AI-slop collage
  - gore as shortcut for anatomy
  - five requested boards collapsed into one composite
  approval_logic: accepted only if the board adds declared new coverage; cosmetic variation does not count
  lineage: every accepted board must declare canonical refs and downstream asset families unlocked
  human_gate: material aesthetic promotion remains human-authoritative
execution:
  rounds: 20
  boards_per_round: 5
  generation_rule: Generate exactly five independent 16:9 boards per round.
  acceptance: Only accepted boards count toward 100.
  saturation_checkpoints_after:
  - 20
  - 40
  - 60
  - 80
  saturation_metrics:
  - accepted-new-coverage ratio
  - redundancy/rejection trend
  - overrepresented families
  - underrepresented coverage cells
  - remaining high-priority gaps
  post_100: VISUAL_SYSTEM_COVERAGE audit; generate only justified gap boards.
boards:
- study_id: A01
  title: Asset Ontology — First Principles
  purpose: Define the full visual-family hierarchy from principle to reusable asset.
  canonical_refs:
  - DVV-VIS-0198
  - DVV-VIS-0150
  required_content:
  - family tree covering structural, typographic, symbolic, specimen, entity, environment, motion and application assets
  - parent/child inheritance markers
  - which families are canonical versus support-derived
  - shared semantic roles across families
  - clear distinction between asset family, variant, state and application
  - examples of one family instantiated at 3 scales
  composition: large central taxonomy with peripheral exemplars; surgical labels; strong negative space
  intensity_mode: H
  target_media: system
  anatomical_abstraction: selective
  oneiric_intensity: controlled-high
  motion_implication: implicit where relevant
  outputs_unlocked: &id004
  - asset ontology seed
  - family IDs
  - inheritance rules
  exclusions:
  - no decorative family names without production meaning
  - no asset examples lacking taxonomy position
  acceptance_criteria:
  - all major visual families represented
  - no duplicate sibling families
  - hierarchy readable at a glance
  sequence: 1
  macrofamily: Asset Family Master Map
  round: R01
  format: one independent 16:9 moodboard; never a five-board composite
