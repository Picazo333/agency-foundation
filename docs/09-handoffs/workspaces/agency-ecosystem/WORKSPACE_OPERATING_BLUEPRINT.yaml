    Govern the complete agency ecosystem from current authoritative repo state through real-world
    validation, commercial-system convergence, delivery readiness and later launch, while preserving
    authority boundaries and preventing Brand, tooling or technical polish from substituting for buyer,
    payment, delivery or runtime evidence.
  current_phase: PRE_VALIDATION_RECONCILIATION
  terminal_state:
    - buyer evidence drives ICP, offer and pricing decisions
    - validated commercial path exists
    - Brand dependencies are integrated without collapsing Brand execution into this workspace
    - delivery, tooling, CRM, analytics and infrastructure are implemented only when justified
    - production website is gated by validated message, Brand and runtime readiness
    - project state remains recoverable from repo without hidden chat memory

