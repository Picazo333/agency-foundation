current_evidence:
  buyer_interviews_recorded: 0
  qualified_buyer_conversations_recorded: 0
  target_accounts_recorded: 0
  price_signals_recorded: 0
  sales_attempts_recorded: 0
  cleared_payments_recorded: 0
  basis:
