  version: "1.0.0"
  source_repo: Picazo333/skill-foundry

conversation:
  proposed_name: "DIVINIVID · Agency Ecosystem · Strategy → Validation → Operations"
  conversation_id: "AGY-ECOSYSTEM-ORCH-01"
  taxonomy:
    portfolio: AGENCY_ECOSYSTEM
    product_brand: DIVINIVID
    workstream: AGENCY_ECOSYSTEM
    domain: BUSINESS_OPERATING_SYSTEM
    lifecycle: PRE_EVIDENCE_TO_REPEATABLE_DELIVERY
    scope: TRANSVERSAL_AGENCY_ORCHESTRATION
    mode: VALIDATION_FIRST_WITH_HUMAN_GATES
  skill_taxonomy:
    family: cross-functional
    capability_class: orchestrator
    scope_class: transversal
  taxonomy_note: >
    Conversation taxonomy is local descriptive metadata. It reuses the existing Skill Foundry
    cross-functional/orchestrator/transversal concepts and does not mutate Skill Foundry taxonomy.

objective:
  primary: >
    Govern the complete agency ecosystem from current authoritative repo state, preserve the boundary
    between canon, proposal and evidence, keep the commercial critical path anchored to external
    reality, and coordinate Brand, validation, delivery, tooling and technical dependencies without
    allowing parallel work to substitute for buyer contact, payment, delivery or runtime evidence.
  current_outcome_target: >
    Move from zero recorded buyer evidence to decision-grade market evidence with the minimum
    credibility and operating support required to make contact safely.
  terminal_direction:
    - validated buyer/problem evidence
    - paid demand evidence
    - delivery evidence
    - proof/case-study evidence
    - calibrated offer/pricing/economics
    - repeatable acquisition and delivery
    - production business systems activated only when their gates are satisfied

workspace_classification:
  type: agency_ecosystem_control_and_execution_scope
  duration: long_running
  complexity: high
  risk: medium
  collaboration_pattern: multi_workstream_human_gated
  side_effect_profile: repo_documentation_plus_external_commercial_actions
  external_effects:
    - buyer_outreach
    - sales
    - payments
    - client_delivery
    - legal_accounting
    - production_runtime
  current_commercial_gate: PRE_BUYER_EVIDENCE

authority:
  priority:
    - current_authoritative_repo_state
    - approved_ADRs_and_canon
    - explicit_current_human_statement
    - current_evidence
    - migration_checkpoints
    - workbench_and_proposals
    - historical_chat
  invariants:
    - merged_proposal_is_not_automatically_agency_decision
    - noema_governs_context_and_conformance_not_agency_domain_decisions
    - divinivid_is_one_workstream_inside_agency_ecosystem
    - external_evidence_outranks_further_desk_planning_when_the_question_requires_reality
    - capability_before_executor
    - configured_is_not_verified
    - plan_is_not_execution

authoritative_sources:
