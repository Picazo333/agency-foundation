  conclusion: >
    Commercial uncertainty remains externally evidence-dependent. More strategic polish cannot
    answer whether buyers volunteer the problem, will pay, or can be served repeatably.

agency_ecosystem_state_map:
  - workstream: repo_governance_and_authority
    state: CANON_APPROVED
    authority: canon
    blocker: none_for_current_reconciliation
    next_decision: none
    evidence:
      - docs/00-meta/source-of-truth.md
      - docs/00-meta/operating-model.md
      - docs/08-plans/master/META_PLAN.md
      - docs/07-decisions/index.md

  - workstream: strategy_thesis_positioning
    state: PROPOSED_REVIEW
    authority: workbench_plus_proposed_ADRs
    blocker: zero_buyer_evidence
    next_decision: >
      Test the working hypotheses in the field before any freeze; do not promote ADR-0006 or
      positioning claims by repetition.
    external_dependency: buyer_conversation

  - workstream: ICP_and_segments
    state: PROPOSED_REVIEW
    authority: workbench
    blocker: founder_U01_U05_not_recorded_and_no_access_evidence
    next_decision: choose_validation_sampling_not_final_ICP
    external_dependency:
      - founder_input
      - buyer_access
      - buyer_resonance

  - workstream: offer_architecture
    state: PROPOSED_REVIEW
    authority: workbench_plus_ADR-0008_PROPOSED
    blocker: no_buyer_problem_or_payment_evidence
    next_decision: validate_offer_shape_without_treating_paid_diagnostic_as_canon
    external_dependency:
      - buyer_conversation
      - payment

  - workstream: pricing_and_economics
    state: EXTERNAL_EVIDENCE_DEPENDENT
    authority: workbench_plus_ADR-0009_PROPOSED
    blocker:
      - founder_capacity_and_runway_inputs
      - no_price_signal
      - no_payment
      - no_real_delivery_hours
    next_decision: calibrate_only_after_real_inputs_and_WTP_evidence
    external_dependency:
      - founder_input
      - payment
      - delivery

  - workstream: field_validation
    state: ACTIVE_EXECUTION
    authority: workbench_instrumentation
    blocker:
      - U01_U05_unanswered_in_repo
      - no_target_list
      - no_external_contact_evidence
    next_decision: complete_D0_inputs_then_start_targeting_and_contact
    external_dependency: buyer_conversation
    critical_path: true

  - workstream: proof_and_case_studies
    state: BLOCKED
    authority: workbench
    blocker: no_completed_client_delivery_or_measured_outcome
    next_decision: capture_baseline_and_proof_from_first_real_engagement
    external_dependency: delivery

  - workstream: acquisition_and_sales
    state: ACTIVE_EXECUTION
    authority: workbench_instruments_ready
    blocker:
      - founder_inputs
      - validation_sampling_choice
      - target_list
    next_decision: send_first_logged_outreach_batch
    external_dependency: buyer_response
    note: >
      Existing field-kit outreach and interview instruments are executable support; their embedded
      strategic assumptions remain proposals.

  - workstream: delivery_client_lifecycle_operations_scorecard
    state: DEFERRED
    authority: workbench
    blocker: no_paid_engagement
    next_decision: activate_minimum_delivery_path_after_sale
    external_dependency: payment

  - workstream: tooling_and_automation
    state: PROPOSED_REVIEW
    authority: workbench_requirements
    blocker: vendor_choices_not_recorded_or_verified_in_repo
    next_decision: >
      Select only tools required by an active workflow; preserve portability and avoid premature
      vendor or production-stack lock-in.
    verified_now:
      - repository_as_code_and_configuration_system
    unverified_vendor_choices:
      - CRM
      - automation_orchestrator
      - analytics_vendor
      - workspace_vendor
      - hosting_vendor
    note: >
      TOOLING_AUTOMATION_REQUIREMENTS defines categories and selection criteria, not approved vendors.

  - workstream: brand_DIVINIVID
    state: ACTIVE_EXECUTION
    authority: human_approved_brand_canon_plus_brand_workstream
    blocker: P6_HUMAN_REVIEW_GATE
    next_decision: human_PASS_or_bounded_MUTATE_in_brand_scope
    owner_scope: brand_identity_to_vertical_slice
    critical_path: false

  - workstream: asset_factory
    state: BLOCKED
    authority: integrated_workbench_architecture
    blocker:
      - final_expression_identity_maturity
      - executable_production_matrix
      - golden_set_factory_pilot
    next_decision: activation_gate_after_brand_prerequisites
    note: >
      Architecture is already integrated on main through PR #17. The open Issue #3 must not be
      interpreted as proof that the architecture does not exist.

  - workstream: neutral_technical_foundation
    state: CANON_APPROVED
    authority: ADR-0011_plus_integrated_foundation
    blocker: none_for_neutral_baseline
    next_decision: defer_production_stack_selection_until_real_implementation_requirements
    note: >
      Neutral foundation was integrated through PR #18. Labs are evidence, not production maturity.

  - workstream: MVS
    state: PROPOSED_REVIEW
    authority: workbench_web_requirements
    blocker:
      - validation_targeting_not_resolved
      - unvalidated_marketing_copy
    next_decision: >
      Build only the smallest credibility surface that materially increases buyer-contact quality;
      do not wait for Brand V1 and do not turn it into production Website Strategy/IA.
    relationship:
      not_brand_vertical_slice: true
      not_production_website: true

  - workstream: brand_vertical_slice_prototype
    state: BLOCKED
    authority: brand_operating_scope_contract
    blocker: DIVINIVID_FINAL_EXPRESSION_LOCK_V1_not_reached
    next_decision: owned_by_brand_scope_after_final_lock
    relationship:
      not_MVS: true
      not_production_website: true

  - workstream: production_website
    state: DEFERRED
    authority: downstream_plan_only
    blocker:
      - business_validation
      - final_brand_expression
      - website_strategy_IA
      - production_stack_decision
    next_decision: activate_only_after_downstream_gates
    relationship:
      not_MVS: true
      not_brand_vertical_slice: true

  - workstream: noema_vnext_agency_adoption
    state: DEFERRED
    authority: noema_for_protocol_agency_repo_for_domain
    blocker: repo_specific_adoption_decision_not_executed
    next_decision: >
      Perform a bounded agency-specific KEEP/MODIFY/ADD/DEFER assessment before any vNext mutation;
      do not treat upstream vNext release as agency migration.
    evidence:
      agency_manifest: selective-rc0-migration
      upstream_noema_registry: rc0-configured-domain-gated
      upstream_vnext_release: released_and_post_merge_verified
    critical_path: false

  - workstream: skill_foundry_relationship
    state: CANON_APPROVED
    authority: external_skill_foundry_for_skill_semantics
    blocker: none_for_current_scope_contract
    next_decision: reuse_existing_skills_before_new_skill
    verified_capability:
      id: workspace-operating-contract-orchestrator
      version: "1.0.0"
      disposition: REUSE

  - workstream: legal_and_accounting
    state: EXTERNAL_EVIDENCE_DEPENDENT
    authority: professional_external
    blocker:
      first_SOW: local_legal_review
      first_invoice: local_accounting_tax_setup
    next_decision: start_parallel_professional_setup_before_first_sale_requires_it
    note: conversations_need_not_wait_unless_local_contact_rules_block_them

critical_path:
  principle: external_reality_first
  sequence:
    - founder_U01_U05_and_D0_constraints
    - validation_sampling_choice_primary_plus_hedge_if_used
    - target_account_ledger
    - first_logged_outreach
    - qualified_buyer_conversations
    - problem_resonance_evidence
    - payment_evidence
    - first_delivery
    - measured_outcome_and_case_study
    - repeatability
  stop_desk_research_when_requires:
    - buyer_conversation
    - payment
    - delivery
    - runtime
    - legal_or_accounting_advice
    - production_telemetry

parallel_tracks:
  - track: brand
    allowed_now: P6_human_review_in_brand_scope
    may_block_commercial_validation: false
  - track: legal_accounting
    allowed_now: jurisdiction_and_compliance_setup
    may_block_commercial_validation: false_until_sale_or_contact_rule
  - track: MVS_credibility_support
    allowed_now: only_minimum_surface_if_it_unlocks_contact
    may_block_commercial_validation: false_by_default
  - track: neutral_technical_foundation
    allowed_now: maintenance_only
    may_block_commercial_validation: false
  - track: asset_factory
    allowed_now: no_mass_production
    may_block_commercial_validation: false
  - track: noema_vnext
    allowed_now: bounded_adoption_assessment_only
    may_block_commercial_validation: false

human_external_gates:
