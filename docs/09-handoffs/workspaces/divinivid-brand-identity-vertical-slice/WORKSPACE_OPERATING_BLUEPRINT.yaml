    name: Human Final Gate
    authority: HUMAN_OWNER_ONLY
    output_on_pass: DIVINIVID_FINAL_EXPRESSION_LOCK_V1
  F:
    name: Brand Vertical Slice Prototype
    prerequisite: DIVINIVID_FINAL_EXPRESSION_LOCK_V1
