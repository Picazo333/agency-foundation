  schemas_interfaces:
    route: NO_SKILL
    rationale: no new cross-system interface is required for the current gate
  execution:
    route: REUSE
    mechanism:
      - brand workstream staged plan
      - minimum_necessary_mutation
      - tool_execution_contracts
