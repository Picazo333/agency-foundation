    Stop visual execution at the P6 human gate until the human owner returns PASS or one bounded MUTATE reason.
  terminal: >
    Stop this conversation after Final Expression Lock, one high-fidelity Brand Vertical Slice Prototype,
    QA PASS, and final boundary handoff. Do not continue into production website/system implementation.
