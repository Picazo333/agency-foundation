      - proposal_sales
      - case_study_editorial
      - social_campaign
      - clinical_B2B_sensitive
    stressors:
      - ivory_light_field
      - minimal_crimson
      - high_information_density
      - minimal_imagery
      - low_quality_reproduction
  C:
    name: P8 Final Pre-Lock Synthesis
    output: DIVINIVID_FINAL_EXPRESSION_SPEC_V1
    evidence_policy: approved_evidence_only
  D:
    name: Independent Brand Red Team
    attack_surfaces:
      - generic_dark_luxury
      - over_medievalization
      - medical_brand_collapse
      - hero_art_dependency
      - dense_data_usability
      - accessibility
      - ES_EN_parity
      - conservative_B2B_trust
      - cheap_reproducibility_maintainability
