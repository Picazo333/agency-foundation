skills:
  - id: design-taste-frontend
    display_name: Taste
    status: approved
    intake_tier: 1
    authority: advisory
    execution_mode: reference_only
    source:
      repository: Leonxlnx/taste-skill
      commit: ccbc15639c97057cbfcf32ecebc38ef716e4bb37
      path: skills/taste-skill/SKILL.md
      license: MIT
    purpose: >-
      Anti-slop design direction for landing pages, portfolios, redesigns and editorial/brand-facing frontend work.
      Use to infer the design read, expose generic AI defaults and calibrate variance/motion/density.
    allowed_phases:
      - visual-direction-review
      - signature-concept-review
      - composition-review
      - digital-brand-specimen
      - stress-test
    prohibited:
      - overriding brand canon
      - deciding business strategy
      - auto-installing packages or frameworks
      - executing shell commands without human approval
    notes: >-
      v2 is experimental upstream. Project use is pinned to this reviewed commit; upstream updates are not automatic.

  - id: gpt-taste
    display_name: GPT Taste
    status: approved_with_restrictions
    intake_tier: 1
    authority: advisory
    execution_mode: reference_only
    source:
      repository: Leonxlnx/taste-skill
      commit: ccbc15639c97057cbfcf32ecebc38ef716e4bb37
      path: skills/gpt-tasteskill/SKILL.md
      license: MIT
    purpose: >-
      Aggressive anti-default frontend and motion guidance for later digital experimentation.
    allowed_phases:
      - digital-brand-specimen
      - motion-experiment
      - frontend-red-team
    prohibited:
      - brand naming
      - visual canon definition
      - logo or signature authority
      - mandatory AIDA/GSAP/randomization when inconsistent with the approved route
      - executing shell/package actions without human approval
    notes: >-
      Strongly prescriptive. Treat as a challenger/red-team lens, not a governing design system. The project brief always wins.

