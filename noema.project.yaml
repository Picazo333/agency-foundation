quality_claims:
  - contract-conformance
  - delivery-integrity
  - research-groundedness
  - visual-coherence
  - provenance
  - context-efficiency
  - security-boundaries
  - recoverability

relations:
  - type: conforms-to
    target: project:noema
  - type: consumes-capabilities-from
    target: project:skill-foundry
  - type: may-publish-harvest-to
    target: project:skill-foundry
  - type: may-publish-harvest-to
    target: project:noema

exceptions: []

extensions:
  x-brand-system-authority: human-approved-divinivid-canon
  x-noema-adoption: selective-rc0-migration
  x-stable-project-id: agency-foundation
  x-project-display-name: DIVINIVID
  x-planned-repository-slug: divinivid
