        - repo://docs/00-meta/source-of-truth.md
        - repo://docs/00-meta/capability-governance.md
        - repo://asset-factory/spec/01-brand-pack-contract.md
    audit:
      required:
        - repo://docs/00-meta/source-of-truth.md
        - repo://docs/00-meta/definitions-of-done.md
