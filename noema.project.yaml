noema:
  protocol: "0.1.0-rc.0"
  contracts:
    project_manifest: 1

project:
  id: agency-foundation
  name: DIVINIVID
  type: delivery-system
  status: active

traits:
  - creative
  - agentic
  - research-heavy
  - customer-facing
  - human-gated
  - reusable
  - visual
  - external-effects

authority:
  owns:
    - agency-strategy-and-delivery-canon
    - divinivid-brand-canon
    - divinivid-visual-universe
    - brand-workbench-and-human-gates
    - asset-factory-contracts
    - field-validation-evidence
    - project-harvest-records
    - agency-local-asset-lifecycle
  does_not_own:
    - noema-protocol
    - skill-foundry-taxonomy
    - skill-foundry-ontology
    - skill-foundry-registry
    - external-executor-runtime
    - secrets
    - future-cross-project-media-storage

