        - repo://docs/03-brand/workbench/divinivid/generation/DIVINIVID_CORE_LOCK_V1.md
        - repo://docs/03-brand/workbench/divinivid/generation/DIVINIVID_BASE_LOCK_B1.md
        - repo://docs/00-meta/dependency-map.md
        - repo://docs/07-decisions/index.md
        - repo://asset-factory/spec/01-brand-pack-contract.md
        - repo://asset-factory/spec/04-metadata-provenance-schema.md
    visual_generation:
      required:
        - repo://docs/03-brand/workbench/divinivid/generation/CURRENT_GENERATION_STATE.yaml
        - repo://docs/03-brand/workbench/divinivid/generation/DIVINIVID_CORE_LOCK_V1.md
        - repo://docs/03-brand/workbench/divinivid/generation/DIVINIVID_BASE_LOCK_B1.md
